name: Build

on:
  push:
  pull_request:

jobs:
  build-open-source:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Build without official runtime
        shell: powershell
        run: .\build.ps1 -SkipOfficialRuntime

      - name: Run offline self-test
        shell: powershell
        run: .\dist\EcloudLite.SelfTest.exe

      - name: Stage open-source build artifacts
        shell: powershell
        run: |
          New-Item -ItemType Directory -Force -Path .\artifacts | Out-Null
          Copy-Item .\dist\EcloudLite.exe .\artifacts\
          Copy-Item .\dist\EcloudLite.SelfTest.exe .\artifacts\
          Copy-Item .\dist\cmsszte-public.pem .\artifacts\

      - name: Upload open-source build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: EcloudLite-open-source
          path: artifacts/
          if-no-files-found: error
